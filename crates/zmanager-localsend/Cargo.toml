[package]
name = "zmanager-localsend"
version.workspace = true
description = "LAN peer discovery and LocalSend-protocol file transfer for ZManager."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# Fork of CrossCopy/localsend-rs (MIT) — see NOTICE / THIRD_PARTY_NOTICES.md.
# Active co-development resolves the patched sibling checkout. Cargo publish
# converts this path-plus-version dependency to registry `0.1.2`; crates.io
# does not permit external Git dependencies in published packages.
localsend-rs = { path = "../../../localsend-rs", version = "0.1.2", default-features = false, features = [
    "https",
] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
