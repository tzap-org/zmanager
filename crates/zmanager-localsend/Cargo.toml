[package]
name = "zmanager-localsend"
version.workspace = true
description = "LAN peer discovery and LocalSend-protocol file transfer for ZManager."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# Fork of CrossCopy/localsend-rs (MIT) — see NOTICE / THIRD_PARTY_NOTICES.md.
# Active co-development intentionally resolves the sibling checkout so desktop,
# mobile, and CLI builds exercise the patched working tree. CI and release
# workflows check out the exact revision recorded in localsend-rs-rev.txt.
localsend-rs = { path = "../../../localsend-rs", default-features = false, features = [
    "https",
] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
