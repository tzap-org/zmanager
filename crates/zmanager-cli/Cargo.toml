[package]
name = "zmanager-cli"
version.workspace = true
description = "Command-line archive manager powered by zmanager-core."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
build = "build.rs"
default-run = "zm"

[[bin]]
name = "zmanager-cli"
path = "src/main.rs"

[[bin]]
name = "zm"
path = "src/bin/zm.rs"

[features]
default = []
# zmanager-tzap-hosted is always present: it separates its own HTTP
# transport behind `reqwest-transport`, so the default build keeps local
# signing/verification/certs (offline TZAP surface) while dropping reqwest
# and the hosted (network) commands entirely.
tzap-online = ["dep:reqwest", "zmanager-tzap-hosted/reqwest-transport"]
# Personal certificate/device revocation is disabled by default: the sign server requires a
# recent admin MFA step-up on the calling session, and the CLI has no way to obtain one (no TOTP
# prompt, and a step-up performed elsewhere belongs to a different session). Revocation lives in
# the hosted console until a step-up flow exists here. Enable to re-expose `zm tzap device
# revoke` and `zm tzap device retire` once that lands.
hosted-revocation = []

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls-vendored", "charset", "http2", "system-proxy"], optional = true }
rpassword = "7.5.2"
serde_json = "1.0.140"
zmanager-core = { workspace = true }
zmanager-tzap-hosted = { workspace = true, features = ["keyring"] }

[dev-dependencies]
ad1 = { version = "0.1.1", package = "ad1-core", features = ["testfix"] }
aff4 = { version = "0.2", features = ["test-helpers"] }
flate2 = "1.1.9"
sha2 = "0.10.9"
tar = "0.4.45"
zip = "8.6.0"
zstd = "0.13.3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
xattr = "1.6.1"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
] }

[lints]
workspace = true
