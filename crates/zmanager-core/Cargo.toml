[package]
name = "zmanager-core"
version.workspace = true
description = "Core archive, offline identity, and policy engine for ZManager."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
path = "src/lib.rs"

[features]
default = []

[dependencies]
# Already reachable through the `zip`/`flate2` trees; direct deps for the
# lzop decoder's header/block checksums.
adler2 = "2.0.1"
argon2 = "0.5.3"
base64 = "0.22.1"
brotli = "8.0.2"
crc32fast = "1.5.0"
bzip2 = "0.6.1"
cab = "0.6.0"
msi = "0.10.0"
filetime = "0.2.29"
flate2 = "1.1.9"
hex = "0.4"
lz4_flex = "0.14.0"
lzma-rust2 = { version = "0.16.2", default-features = false, features = ["lzip", "std", "xz"] }
# Pure-Rust LZO1X block decompressor (SecurityRonin family, Apache-2.0);
# the lzop container framing around the blocks lives in `lzop_decoder.rs`.
lzo = "0.1.3"
openssl = "0.10.80"
rand = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.140"
serde_json_canonicalizer = "0.3.2"
sha1 = "0.10.7"
sha2 = "0.10.8"
time = { version = "0.3.47", features = ["parsing"] }
x509-parser = "0.18.1"
sevenz-rust2 = { version = "0.21.0", default-features = false, features = ["aes256", "compress", "util"] }
tar = "0.4.45"
tzap-core = "0.2.3"
tzap-plugin-keywrap = "0.2.3"
tzap-plugin-signing = "0.2.3"
zip = "8.6.0"
zeroize = "1.8.2"
rayon = "1.10"
memchr = "2.7"
zmanager-wim = { workspace = true }
zmanager-unrar = { workspace = true }

zstd = { version = "0.13.3", features = ["zstdmt"] }
# SquashFS reader. `parallel` is on because the reader parallelizes block decode.
# backhand's own `xz` and `lzo` features are deliberately OFF: `xz` pulls `liblzma`
# (which declares `links = "lzma"` and collides with `lzma-sys`), while `lzo` pulls
# `rust-lzo` (GPL-2.0). XZ, LZMA, and LZO are instead supplied under Apache-2.0 / MIT
# by `squashfs_backend::XzCapableCompressor`, backed by `lzma-rust2` and `lzo`.
backhand = { version = "0.25", default-features = false, features = ["gzip", "zstd", "lz4", "parallel"] }
# Upstream `dev` now contains the APFS symlink fix and XAR PR #5. The fork's
# `zmanager-integration` branch adds the focused XAR <name enctype="base64">
# filename fix from `xar-name-base64-enctype` until that change is upstreamed.
dpp = { git = "https://github.com/frankmanzhu/dpp", branch = "zmanager-integration" }
delharc = { version = "0.8.0", default-features = false, features = ["std", "lh1", "lz", "lhx"] }
# Forensic disk-image stack: VHD/VMDK containers, MBR/GPT volume systems, and
# NTFS/FAT/ext4/UDF filesystems (SecurityRonin family, Apache-2.0/MIT, read-only).
# Path dependency on the sibling checkout so engine/adapter bugs can be patched
# locally and pushed to https://github.com/frankmanzhu/forensic-vfs-engine with an
# upstream PR — the dpp precedent. Switch back to crates.io when the family
# stabilizes: drop the `path` key and keep `version = "0.1"` (relax the exact pin).
forensic-vfs-engine = { path = "../../../forensic-vfs-engine", version = "=0.1.10" }
# The engine does not re-export the contract types (FileSystem, FsKind, ...);
# same floor as the engine so cargo unifies to one copy.
forensic-vfs = "0.7"
# Pinned fork: hybrid ISO session validation fix, aligned with the engine's
# forensic-vfs 0.7 dependency until a compatible upstream release exists.
iso = { git = "https://github.com/frankmanzhu/iso9660-forensic", rev = "2e8619d", version = "0.8.0", package = "iso9660-forensic" }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
zmanager-apple-archive = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(unix)'.dev-dependencies]
xattr = "1.6.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
] }

[dev-dependencies]
ad1 = { version = "0.1.1", package = "ad1-core", features = ["testfix"] }
aff4 = { version = "0.2", features = ["test-helpers"] }
crc32c = "0.6"

[[bench]]
name = "core_benchmarks"
harness = false

[lints]
workspace = true
