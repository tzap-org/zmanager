[package]
name = "zmanager-ffi"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
name = "zmanager_ffi"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uniffi = { version = "0.29", features = ["cli"] }
zmanager-core = { path = "../zmanager-core" }

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }
