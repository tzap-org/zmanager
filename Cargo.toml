[workspace]
members = [
    "crates/zmanager-apple-archive",
    "crates/zmanager-cli",
    "crates/zmanager-core",
    "crates/zmanager-ffi",
    "crates/zmanager-localsend",
    "crates/zmanager-wim",
    "crates/zmanager-tzap-hosted",
    "crates/zmanager-unrar",
]
resolver = "2"

[workspace.package]
version = "2.3.1-dev"
edition = "2024"
# delharc 0.8.0 in the locked dependency graph requires Rust 1.95.
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/tzap-org/zmanager"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
zmanager-apple-archive = { path = "crates/zmanager-apple-archive", version = "2.3.1-dev" }
zmanager-cli = { path = "crates/zmanager-cli", version = "2.3.1-dev" }
# default-features = false: the core crate has no hosted transport feature;
# hosted account/certificate behavior is composed explicitly by products that
# depend on `zmanager-tzap-hosted`.
zmanager-core = { path = "crates/zmanager-core", version = "2.3.1-dev", default-features = false }
zmanager-tzap-hosted = { path = "crates/zmanager-tzap-hosted", version = "2.3.1-dev" }
zmanager-localsend = { path = "crates/zmanager-localsend", version = "2.3.1-dev" }
zmanager-ffi = { path = "crates/zmanager-ffi", version = "2.3.1-dev" }
zmanager-wim = { path = "crates/zmanager-wim", version = "2.3.1-dev" }
zmanager-unrar = { path = "crates/zmanager-unrar", version = "2.3.1-dev" }

# The TZAP family (core plus the keywrap and signing plugins) uses crates.io
# dependencies. Local development can track ../tzap changes via a
# [patch.crates-io] in .cargo/config.toml. The committed lockfiles track the
# published dependency for Security Audit CI. Build/test, package-preview, and
# release workflows drop the development patch before their locked builds.

# Keep local overrides only where the published crate is either incompatible
# with the engine's VFS 0.7 contract or still has affected codec dependencies.
[patch.crates-io]
btrfs-core = { path = "../btrfs-core/core" }
zfs-forensic-core = { path = "../zfs-forensic-core/core" }
backhand = { path = "../backhand/backhand" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
