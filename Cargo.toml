[workspace]
members = [
    "crates/zmanager-apple-archive",
    "crates/zmanager-cli",
    "crates/zmanager-core",
    "crates/zmanager-ffi",
    "crates/zmanager-localsend",
    "crates/zmanager-wim",
    "crates/zmanager-tzap-hosted",
    "crates/zmanager-unrar",
]
resolver = "2"

[workspace.package]
version = "2.1.7"
edition = "2024"
# Floor set by the forensic-vfs-engine sibling (rust-version = "1.93"); keep in
# sync with the engine's declared MSRV when the family updates.
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/tzap-org/zmanager"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
zmanager-apple-archive = { path = "crates/zmanager-apple-archive", version = "2.1.7" }
zmanager-cli = { path = "crates/zmanager-cli", version = "2.1.7" }
# default-features = false: the core crate has no hosted transport feature;
# hosted account/certificate behavior is composed explicitly by products that
# depend on `zmanager-tzap-hosted`.
zmanager-core = { path = "crates/zmanager-core", version = "2.1.7", default-features = false }
zmanager-tzap-hosted = { path = "crates/zmanager-tzap-hosted", version = "2.1.7" }
zmanager-localsend = { path = "crates/zmanager-localsend", version = "2.1.7" }
zmanager-ffi = { path = "crates/zmanager-ffi", version = "2.1.7" }
zmanager-wim = { path = "crates/zmanager-wim", version = "2.1.7" }
zmanager-unrar = { path = "crates/zmanager-unrar", version = "2.1.7" }

# The TZAP 0.2.7 release carries `entry_metadata::projected_posix_mode`, so the
# whole family (core plus the keywrap and signing plugins) is a plain crates.io
# dependency here. Local development and Security Audit CI can track ../tzap
# changes via a [patch.crates-io] in .cargo/config.toml. The committed
# Cargo.lock tracks the published dependency; build/test, package-preview, and
# release workflows drop the development patch before their locked builds.

# Temporary security updates for forensic readers whose published releases
# still require vulnerable codec versions. See docs/FORENSIC_SECURITY_FORKS.md.
[patch.crates-io]
aff4 = { path = "../aff4/core" }
btrfs-core = { path = "../btrfs-core/core" }
dar-core = { path = "../dar-core/core" }
zfs-forensic-core = { path = "../zfs-forensic-core/core" }
zip-forensic-core = { path = "../zip-forensic-core/core" }
backhand = { path = "../backhand/backhand" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
