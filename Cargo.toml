[workspace]
members = [
    "crates/zmanager-apple-archive",
    "crates/zmanager-cli",
    "crates/zmanager-core",
    "crates/zmanager-ffi",
    "crates/zmanager-localsend",
    "crates/zmanager-wim",
    "crates/zmanager-tzap-hosted",
    "crates/zmanager-unrar",
]
resolver = "2"

[workspace.package]
version = "2.1.2"
edition = "2024"
# Floor set by the forensic-vfs-engine sibling (rust-version = "1.93"); keep in
# sync with the engine's declared MSRV when the family updates.
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/tzap-org/zmanager"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
zmanager-apple-archive = { path = "crates/zmanager-apple-archive", version = "2.1.2" }
zmanager-cli = { path = "crates/zmanager-cli", version = "2.1.2" }
# default-features = false: the core crate has no hosted transport feature;
# hosted account/certificate behavior is composed explicitly by products that
# depend on `zmanager-tzap-hosted`.
zmanager-core = { path = "crates/zmanager-core", version = "2.1.2", default-features = false }
zmanager-tzap-hosted = { path = "crates/zmanager-tzap-hosted", version = "2.1.2" }
zmanager-localsend = { path = "crates/zmanager-localsend", version = "2.1.2" }
zmanager-ffi = { path = "crates/zmanager-ffi", version = "2.1.2" }
zmanager-wim = { path = "crates/zmanager-wim", version = "2.1.2" }
zmanager-unrar = { path = "crates/zmanager-unrar", version = "2.1.2" }

# TZAP 0.2.4 includes the Unicode-safe volume-name parsing fix that previously
# required a temporary sibling-checkout patch.

# Temporary sibling-checkout patch again: the POSIX mode projection that hosts
# without one have to apply now lives in tzap-core as
# `entry_metadata::projected_posix_mode`, so the rule has a single owner instead
# of one copy here and one in tzap-cli, which had already drifted apart. Drop
# this patch once a tzap-core release carries that function.
[patch.crates-io]
tzap-core = { path = "../tzap/crates/tzap-core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
