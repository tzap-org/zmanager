[workspace]
members = [
    "crates/zmanager-apple-archive",
    "crates/zmanager-cli",
    "crates/zmanager-core",
    "crates/zmanager-ffi",
    "crates/zmanager-localsend",
    "crates/zmanager-wim",
    "crates/zmanager-tzap-hosted",
    "crates/zmanager-unrar",
]
resolver = "2"

[workspace.package]
version = "2.1.4"
edition = "2024"
# Floor set by the forensic-vfs-engine sibling (rust-version = "1.93"); keep in
# sync with the engine's declared MSRV when the family updates.
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/tzap-org/zmanager"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
zmanager-apple-archive = { path = "crates/zmanager-apple-archive", version = "2.1.4" }
zmanager-cli = { path = "crates/zmanager-cli", version = "2.1.4" }
# default-features = false: the core crate has no hosted transport feature;
# hosted account/certificate behavior is composed explicitly by products that
# depend on `zmanager-tzap-hosted`.
zmanager-core = { path = "crates/zmanager-core", version = "2.1.4", default-features = false }
zmanager-tzap-hosted = { path = "crates/zmanager-tzap-hosted", version = "2.1.4" }
zmanager-localsend = { path = "crates/zmanager-localsend", version = "2.1.4" }
zmanager-ffi = { path = "crates/zmanager-ffi", version = "2.1.4" }
zmanager-wim = { path = "crates/zmanager-wim", version = "2.1.4" }
zmanager-unrar = { path = "crates/zmanager-unrar", version = "2.1.4" }

# The TZAP 0.2.5 release carries `entry_metadata::projected_posix_mode`, so the
# whole family (core plus the keywrap and signing plugins) is a plain crates.io
# dependency here. Local development and CI still track the ../tzap sibling
# ahead of release via a [patch.crates-io] in .cargo/config.toml (a
# config-file patch overrides one here, and doesn't force this manifest's
# committed Cargo.lock out of sync). Only release.yml resets that file to
# drop the patch, so the tagged release build resolves tzap-core from
# crates.io.

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
