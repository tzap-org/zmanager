name: Offline Package Identity Audit

on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Package Preview run with successful package jobs for the audited targets
        required: true
        type: string
      package_commit:
        description: Exact commit SHA expected in that Package Preview run
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
  PACKAGE_COMMIT: ${{ inputs.package_commit }}
  ZMANAGER_TEST_SKIP_REPORT: ${{ github.workspace }}/target/package-identity-skips.jsonl
  ZMANAGER_BUILD_MODE: snapshot
  ZMANAGER_BUILD_INPUTS_LOCK: .build-inputs/ci-sibling-inputs.lock

jobs:
  linux:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v6
      - name: Initialize optional test reporting
        run: |
          mkdir -p target
          : > "$ZMANAGER_TEST_SKIP_REPORT"
      - name: Verify and download the selected package build
        run: |
          python3 scripts/download-offline-audit-package.py --run-id "$PACKAGE_RUN_ID" \
            --commit "$PACKAGE_COMMIT" --target "${{ matrix.target }}" --destination packages
      - uses: actions/download-artifact@v7
        name: Download package sibling snapshot
        with:
          name: ci-sibling-inputs
          path: .build-inputs
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare harness dependencies
        shell: bash
        run: |
          bash scripts/prepare-sibling-inputs.sh --mode snapshot --lockfile "$ZMANAGER_BUILD_INPUTS_LOCK"
          sudo apt-get update
          sudo apt-get install -y build-essential musl-tools clang libclang-dev cmake pkg-config libssl-dev liblzma-dev libbz2-dev liblz4-dev libzstd-dev libexpat1-dev nettle-dev zlib1g-dev dbus dbus-x11 gnome-keyring strace xauth xvfb xdotool
          rustup toolchain install stable --profile minimal
          rustup default stable
          target="${{ matrix.target }}"
          target_env="${target//-/_}"
          export "CC_${target_env}=musl-gcc" "AR_${target_env}=musl-ar"
          openssl_dir="$(python3 scripts/build-openssl.py "${{ matrix.target }}")"
          printf '%s\n' "OPENSSL_DIR=$openssl_dir" OPENSSL_STATIC=1 OPENSSL_NO_VENDOR=1 >> "$GITHUB_ENV"
          # Resolve the same frozen TZAP sibling used by the package build.
          cargo test --release -p zmanager-cli --no-default-features --test offline_tzap_cli --no-run
      - name: Test installed identities with outbound networking denied
        timeout-minutes: 10
        run: |
          bus_directory=$(mktemp -d)
          mapfile -t bus < <(dbus-daemon --session --fork --address="unix:path=$bus_directory/bus" --print-address=1 --print-pid=1)
          export DBUS_SESSION_BUS_ADDRESS=${bus[0]}
          export DBUS_SESSION_BUS_PID=${bus[1]}
          trap 'kill "$DBUS_SESSION_BUS_PID"; rm -rf "$bus_directory"' EXIT
          printf '\n' | gnome-keyring-daemon --unlock
          export ZMANAGER_TEST_EXPORT_DISK_FULL=1
          sudo --preserve-env=HOME,PATH,RUSTUP_HOME,CARGO_HOME,LANG,LC_ALL,GITHUB_ACTIONS,RUNNER_ENVIRONMENT,DBUS_SESSION_BUS_ADDRESS,ZMANAGER_TEST_EXPORT_DISK_FULL,ZMANAGER_TEST_SKIP_REPORT \
            unshare --net --setuid "$(id -u)" --setgid "$(id -g)" -- \
            python3 scripts/require-network-denial.py \
            python3 scripts/test-offline-package.py "packages/zm-${{ matrix.target }}.tar.gz" \
            --workflow cargo test --offline --locked --release -p zmanager-cli --no-default-features --test offline_tzap_cli -- --nocapture
      - name: Test installed Secret Service recovery with outbound networking denied
        timeout-minutes: 10
        env:
          ZMANAGER_TEST_CATALOG_DISK_FULL: "1"
          ZMANAGER_TEST_IDENTITY_INTERRUPT: "1"
        run: |
          sudo --preserve-env=HOME,PATH,RUSTUP_HOME,CARGO_HOME,LANG,LC_ALL,GITHUB_ACTIONS,RUNNER_ENVIRONMENT,ZMANAGER_TEST_CATALOG_DISK_FULL,ZMANAGER_TEST_IDENTITY_INTERRUPT,ZMANAGER_TEST_SKIP_REPORT \
            unshare --net --setuid "$(id -u)" --setgid "$(id -g)" -- \
            python3 scripts/require-network-denial.py \
            python3 scripts/test-offline-package.py "packages/zm-${{ matrix.target }}.tar.gz" \
            --workflow python3 -c 'import os,subprocess; subprocess.run(["python3","scripts/test-linux-secret-store.py",os.environ["ZMANAGER_AUDIT_BINARY"]],check=True)'
      - name: Report optional check inventory
        if: always()
        run: python3 scripts/report-test-skips.py "$ZMANAGER_TEST_SKIP_REPORT"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: package-identity-skips-${{ matrix.target }}
          path: |
            target/package-identity-skips.jsonl
            Cargo.lock
          if-no-files-found: warn

  windows:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            triplet: x64-windows-static
            vcarch: x64
            component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            triplet: arm64-windows-static
            vcarch: arm64
            component: Microsoft.VisualStudio.Component.VC.Tools.ARM64
    steps:
      - uses: actions/checkout@v6
      - name: Initialize optional test reporting
        shell: bash
        run: |
          mkdir -p target
          : > "$ZMANAGER_TEST_SKIP_REPORT"
      - name: Verify and download the selected package build
        shell: bash
        run: |
          python scripts/download-offline-audit-package.py --run-id "$PACKAGE_RUN_ID" \
            --commit "$PACKAGE_COMMIT" --target "${{ matrix.target }}" --destination packages
      - uses: actions/download-artifact@v7
        name: Download package sibling snapshot
        with:
          name: ci-sibling-inputs
          path: .build-inputs
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Prepare harness source dependencies
        shell: bash
        run: |
          bash scripts/prepare-sibling-inputs.sh --mode snapshot --lockfile "$ZMANAGER_BUILD_INPUTS_LOCK"
      - name: Prepare native export debugger
        shell: pwsh
        timeout-minutes: 10
        run: ./scripts/prepare-windows-export-debugger.ps1 -Target "${{ matrix.target }}"
      - name: Test installed identities with outbound networking denied
        shell: pwsh
        run: >
          powershell -ExecutionPolicy Bypass -File scripts/ci-windows.ps1
          -Target "${{ matrix.target }}"
          -Triplet "${{ matrix.triplet }}"
          -VcArch "${{ matrix.vcarch }}"
          -VsComponent "${{ matrix.component }}"
          -AuditOfflinePackage "packages/zm-${{ matrix.target }}.zip"
      - name: Report optional check inventory
        if: always()
        shell: pwsh
        run: python scripts/report-test-skips.py "$env:ZMANAGER_TEST_SKIP_REPORT"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: package-identity-skips-${{ matrix.target }}
          path: |
            target/package-identity-skips.jsonl
            Cargo.lock
          if-no-files-found: warn
