name: Bump Workspace Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New semver release version (e.g. 0.2.3)'
        required: true
        type: string

permissions:
  contents: write

env:
  ZMANAGER_BUILD_MODE: snapshot
  ZMANAGER_BUILD_INPUTS_LOCK: .build-inputs/ci-sibling-inputs.lock

jobs:
  bump-version:
    name: Bump Version to ${{ inputs.version }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Resolve sibling branch snapshot
        run: bash scripts/prepare-sibling-inputs.sh --lockfile release-build-inputs.lock --resolve-ci .build-inputs/ci-sibling-inputs.lock

      - name: Prepare frozen sibling inputs
        run: bash scripts/prepare-sibling-inputs.sh --mode snapshot --lockfile "$ZMANAGER_BUILD_INPUTS_LOCK"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            brotli \
            bzip2 \
            cmake \
            gcab \
            genisoimage \
            gzip \
            libacl1-dev \
            libarchive-tools \
            libbz2-dev \
            liblz4-dev \
            liblzma-dev \
            libssl-dev \
            libxml2-dev \
            libzstd-dev \
            dpkg-dev \
            lrzip \
            lz4 \
            lzip \
            lzop \
            ncompress \
            python3 \
            rpm \
            unzip \
            xz-utils \
            zlib1g-dev \
            zip \
            zstd
          sudo apt-get install -y 7zip || sudo apt-get install -y p7zip-full
          sudo apt-get install -y lha || sudo apt-get install -y lhasa || true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build pinned OpenSSL
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p')"
          openssl_dir="$(python3 scripts/build-openssl.py "$target")"
          printf '%s\n' "OPENSSL_DIR=$openssl_dir" OPENSSL_STATIC=1 OPENSSL_NO_VENDOR=1 >> "$GITHUB_ENV"

      - name: Run version bump script
        run: |
          chmod +x ./scripts/bump-version.sh
          ./scripts/bump-version.sh "${{ inputs.version }}"

      - name: Verify workspace tests
        run: |
          config_backup=$(mktemp)
          cp .cargo/config.toml "$config_backup"
          restore_cargo_config() {
            cp "$config_backup" .cargo/config.toml
            rm -f "$config_backup"
          }
          trap restore_cargo_config EXIT
          python3 -c 'from pathlib import Path; p=Path(".cargo/config.toml"); s=p.read_text(); marker="[patch.crates-io]"; assert marker in s; p.write_text(s.split(marker, 1)[0].rstrip() + "\n")'
          cargo test --workspace --locked

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to v${{ inputs.version }}"
          git push
