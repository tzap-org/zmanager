name: Bump Workspace Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New semver release version (e.g. 0.2.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  bump-version:
    name: Bump Version to ${{ inputs.version }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Clone tzap
        run: git clone https://github.com/tzap-org/tzap.git ../tzap

      - name: Clone localsend-rs
        run: |
          LOCALSEND_REV=$(cat localsend-rs-rev.txt 2>/dev/null || echo "main")
          git clone https://github.com/frankmanzhu/localsend-rs.git ../localsend-rs
          git -C ../localsend-rs checkout "$LOCALSEND_REV" || git -C ../localsend-rs checkout main

      - name: Clone forensic-vfs-engine
        run: |
          FVE_REV=$(cat forensic-vfs-engine-rev.txt 2>/dev/null || echo "main")
          git clone https://github.com/frankmanzhu/forensic-vfs-engine.git ../forensic-vfs-engine
          git -C ../forensic-vfs-engine checkout "$FVE_REV" || git -C ../forensic-vfs-engine checkout main

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            brotli \
            bzip2 \
            cmake \
            gcab \
            genisoimage \
            gzip \
            libacl1-dev \
            libarchive-tools \
            libbz2-dev \
            liblz4-dev \
            liblzma-dev \
            libssl-dev \
            libxml2-dev \
            libzstd-dev \
            dpkg-dev \
            lrzip \
            lz4 \
            lzip \
            lzop \
            ncompress \
            python3 \
            rpm \
            unzip \
            xz-utils \
            zlib1g-dev \
            zip \
            zstd
          sudo apt-get install -y 7zip || sudo apt-get install -y p7zip-full
          sudo apt-get install -y lha || sudo apt-get install -y lhasa || true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run version bump script
        run: |
          chmod +x ./scripts/bump-version.sh
          ./scripts/bump-version.sh "${{ inputs.version }}"

      - name: Verify workspace tests
        run: cargo test --workspace

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to v${{ inputs.version }}"
          git push
