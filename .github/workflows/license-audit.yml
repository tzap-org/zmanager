name: License Audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licenses:
    name: cargo-deny licenses + bans
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Clone tzap
        run: |
          TZAP_REV=$(cat tzap-rev.txt 2>/dev/null || echo "main")
          git clone https://github.com/tzap-org/tzap.git ../tzap
          git -C ../tzap checkout "$TZAP_REV" || git -C ../tzap checkout main

      - name: Clone localsend-rs
        run: |
          LOCALSEND_REV=$(cat localsend-rs-rev.txt 2>/dev/null || echo "main")
          git clone https://github.com/frankmanzhu/localsend-rs.git ../localsend-rs
          git -C ../localsend-rs checkout "$LOCALSEND_REV" || git -C ../localsend-rs checkout main

      - name: Clone forensic-vfs-engine
        run: |
          FVE_REV=$(cat forensic-vfs-engine-rev.txt 2>/dev/null || echo "main")
          git clone https://github.com/frankmanzhu/forensic-vfs-engine.git ../forensic-vfs-engine
          git -C ../forensic-vfs-engine checkout "$FVE_REV" || git -C ../forensic-vfs-engine checkout main
          UDF_REV=$(cat udf-forensic-rev.txt 2>/dev/null || echo "main")
          git clone https://github.com/frankmanzhu/udf-forensic.git ../udf-forensic
          git -C ../udf-forensic checkout "$UDF_REV" || git -C ../udf-forensic checkout main
          NTFS_REV=$(cat ntfs-forensic-rev.txt 2>/dev/null || echo "main")
          git clone https://github.com/frankmanzhu/ntfs-forensic.git ../ntfs-forensic
          git -C ../ntfs-forensic checkout "$NTFS_REV" || git -C ../ntfs-forensic checkout main

      # cargo-deny-action runs in a container that mounts only the repo at
      # /github/workspace, so the fork siblings cloned to ../ on the runner
      # are invisible to it and the path dependencies fail to resolve. Run
      # cargo-deny directly on the runner instead, where the siblings sit at
      # the paths the path deps expect.
      # The prebuilt release asset is downloaded via gh CLI using the GitHub
      # token to avoid unauthenticated API rate limits on shared runners.
      - name: Install cargo-deny
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download \
            --repo EmbarkStudios/cargo-deny \
            --pattern '*x86_64-unknown-linux-musl.tar.gz' \
            --output - | tar -xz -C /tmp --strip-components=1
          install -m 0755 /tmp/cargo-deny /usr/local/bin/cargo-deny

      - name: Run cargo-deny (licenses)
        run: cargo deny check licenses

      # Freezes the duplicate-version set recorded in deny.toml's [bans] skip
      # list. A bump that introduces a NEW duplicate fails here; the existing
      # ones are listed with the reason each cannot be collapsed today. Kept as
      # its own step so a graph regression is not mistaken for a license one.
      - name: Run cargo-deny (bans)
        run: cargo deny check bans
