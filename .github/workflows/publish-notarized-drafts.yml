name: Publish notarized draft releases

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Only check this draft tag (leave blank to check all drafts)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: publish-notarized-drafts
  cancel-in-progress: false

jobs:
  check:
    name: Check Apple notarization and Gatekeeper
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check draft submissions
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          for secret_name in APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Configure the $secret_name repository Actions secret."
              exit 1
            fi
          done
          key_path="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$key_path"
          chmod 0600 "$key_path"
          APPLE_API_KEY_PATH="$key_path" python3 scripts/publish-notarized-drafts.py
