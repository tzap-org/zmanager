name: Regenerate UniFFI bindings

# Regenerates the checked-in Kotlin and Swift UniFFI bindings in
# crates/zmanager-ffi/bindings/ from the UDL and auto-commits them.
#
# Must be run manually BEFORE tagging a release, so that the tag commit
# includes up-to-date bindings that match the native library being released.
# (zmanager-mobile consumes these files from main as its source of truth.)
#
# Bindings always track the main branch (the UDL there is canonical). The
# workflow only triggers on workflow_dispatch — never on push — so the
# auto-commit cannot re-trigger it.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate UniFFI bindings
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Clone localsend-rs
        shell: bash
        run: |
          LOCALSEND_REV=$(cat localsend-rs-rev.txt 2>/dev/null || echo "main")
          git clone https://github.com/frankmanzhu/localsend-rs.git ../localsend-rs
          git -C ../localsend-rs checkout "$LOCALSEND_REV" || git -C ../localsend-rs checkout main

      - name: Clone forensic-vfs-engine
        shell: bash
        run: |
          FVE_REV=$(cat forensic-vfs-engine-rev.txt 2>/dev/null || echo "main")
          git clone https://github.com/frankmanzhu/forensic-vfs-engine.git ../forensic-vfs-engine
          git -C ../forensic-vfs-engine checkout "$FVE_REV" || git -C ../forensic-vfs-engine checkout main
          bash scripts/checkout-forensic-forks.sh

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libacl1-dev \
            libbz2-dev \
            liblz4-dev \
            liblzma-dev \
            libssl-dev \
            libxml2-dev \
            libzstd-dev \
            zlib1g-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-audit
        run: cargo +stable install cargo-audit --locked --version 0.22.2

      - name: Use published tzap-core dependency
        run: python3 -c 'from pathlib import Path; p=Path(".cargo/config.toml"); p.write_text(p.read_text().split("[patch.crates-io]",1)[0])'

      - name: Build pinned OpenSSL
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p')"
          openssl_dir="$(python3 scripts/build-openssl.py "$target")"
          printf '%s\n' "OPENSSL_DIR=$openssl_dir" OPENSSL_STATIC=1 OPENSSL_NO_VENDOR=1 >> "$GITHUB_ENV"

      - name: Generate UniFFI bindings
        run: |
          REGEN_KOTLIN_DIR="$GITHUB_WORKSPACE/crates/zmanager-ffi/bindings/kotlin" \
          REGEN_SWIFT_DIR="$GITHUB_WORKSPACE/crates/zmanager-ffi/bindings/swift" \
            bash scripts/generate-uniffi-bindings.sh

      # This workflow pushes directly with GITHUB_TOKEN, so the push may not
      # trigger the normal push-based Security Audit workflow.
      - name: Audit Rust dependencies before publishing bindings
        run: |
          git diff --exit-code -- Cargo.lock fuzz/Cargo.lock
          cargo audit --deny unsound --deny yanked --file Cargo.lock
          cargo audit --deny unsound --deny yanked --file fuzz/Cargo.lock

      - name: Commit and push regenerated bindings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main
          git add crates/zmanager-ffi/bindings
          if git diff --cached --quiet; then
            echo "No changes — UniFFI bindings are up to date"
            exit 0
          fi
          git commit -m "chore: regenerate UniFFI bindings"
          git pull --rebase origin main
          git push origin main
