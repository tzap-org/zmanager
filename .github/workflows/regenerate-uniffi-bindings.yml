name: Regenerate UniFFI bindings

# Regenerates the checked-in Kotlin and Swift UniFFI bindings in
# crates/zmanager-ffi/bindings/ from the UDL and auto-commits them.
#
# Must be run manually BEFORE tagging a release, so that the tag commit
# includes up-to-date bindings that match the native library being released.
# (zmanager-mobile consumes these files from main as its source of truth.)
#
# Bindings always track the main branch (the UDL there is canonical). The
# workflow only triggers on workflow_dispatch — never on push — so the
# auto-commit cannot re-trigger it.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate UniFFI bindings
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Clone tzap
        shell: bash
        run: git clone https://github.com/tzap-org/tzap.git ../tzap

      - name: Clone localsend-rs
        shell: bash
        run: |
          LOCALSEND_REV=$(cat localsend-rs-rev.txt 2>/dev/null || echo "main")
          git clone https://github.com/frankmanzhu/localsend-rs.git ../localsend-rs
          git -C ../localsend-rs checkout "$LOCALSEND_REV" || git -C ../localsend-rs checkout main

      - name: Clone forensic-vfs-engine
        shell: bash
        run: |
          FVE_REV=$(cat forensic-vfs-engine-rev.txt 2>/dev/null || echo "main")
          git clone https://github.com/frankmanzhu/forensic-vfs-engine.git ../forensic-vfs-engine
          git -C ../forensic-vfs-engine checkout "$FVE_REV" || git -C ../forensic-vfs-engine checkout main
          UDF_REV=$(cat udf-forensic-rev.txt 2>/dev/null || echo "main")
          git clone https://github.com/frankmanzhu/udf-forensic.git ../udf-forensic
          git -C ../udf-forensic checkout "$UDF_REV" || git -C ../udf-forensic checkout main
          NTFS_REV=$(cat ntfs-forensic-rev.txt 2>/dev/null || echo "main")
          git clone https://github.com/frankmanzhu/ntfs-forensic.git ../ntfs-forensic
          git -C ../ntfs-forensic checkout "$NTFS_REV" || git -C ../ntfs-forensic checkout main

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libacl1-dev \
            libbz2-dev \
            liblz4-dev \
            liblzma-dev \
            libssl-dev \
            libxml2-dev \
            libzstd-dev \
            zlib1g-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Generate UniFFI bindings
        run: |
          REGEN_KOTLIN_DIR="$GITHUB_WORKSPACE/crates/zmanager-ffi/bindings/kotlin" \
          REGEN_SWIFT_DIR="$GITHUB_WORKSPACE/crates/zmanager-ffi/bindings/swift" \
            bash scripts/generate-uniffi-bindings.sh

      - name: Commit and push regenerated bindings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main
          git add crates/zmanager-ffi/bindings
          if git diff --cached --quiet; then
            echo "No changes — UniFFI bindings are up to date"
            exit 0
          fi
          git commit -m "chore: regenerate UniFFI bindings"
          git pull --rebase origin main
          git push origin main
