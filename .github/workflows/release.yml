name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.1.0"
        required: true
      notes:
        description: "Release notes (markdown). Leave blank to auto-generate from commits."
        required: false
      notarization_test:
        description: "Build and notarize macOS CLI artifacts without publishing a release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  ZMANAGER_BUILD_MODE: release
  ZMANAGER_RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  ZMANAGER_NOTARIZATION_TEST: ${{ inputs.notarization_test }}

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            triplet: x64-windows-static
            vcarch: x64
            component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            triplet: arm64-windows-static
            vcarch: arm64
            component: Microsoft.VisualStudio.Component.VC.Tools.ARM64

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.notarization_test && github.ref || github.event.inputs.tag || github.ref_name }}

      - name: Set build revision
        shell: bash
        run: echo "ZMANAGER_BUILD_REV=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Check out locked sibling inputs
        shell: bash
        run: |
          bash scripts/prepare-sibling-inputs.sh --mode release
          bash scripts/release-gate.sh verify-build
          echo "ZMANAGER_RELEASE_INPUTS_VERIFIED=1" >> "$GITHUB_ENV"

      - name: Use published tzap-core (no sibling patch for releases)
        shell: bash
        run: |
          printf '%s\n' '[net]' 'git-fetch-with-cli = true' > .cargo/config.toml
          cargo fetch

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake libb2 lz4 xz zstd

      - name: Force Clang on macOS
        if: runner.os == 'macOS'
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: ${{ runner.os == 'Linux' && !contains(matrix.target, 'unknown-linux-musl') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            cmake \
            file \
            musl-tools \
            xz-utils \
            python3 \
            build-essential
          sudo scripts/install-zig-linux.sh /opt/zig
          echo /opt/zig >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        if: ${{ !contains(matrix.target, 'unknown-linux-musl') }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - uses: actions/setup-python@v6
        if: runner.os == 'Windows'
        with:
          python-version: "3.x"

      - name: Package Unix
        if: ${{ runner.os != 'Windows' && !contains(matrix.target, 'unknown-linux-musl') }}
        run: scripts/package-release.sh "${{ matrix.target }}" dist

      - name: Package Linux musl in Alpine
        if: contains(matrix.target, 'unknown-linux-musl')
        run: scripts/package-release-alpine.sh "${{ matrix.target }}" dist

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          powershell -ExecutionPolicy Bypass -File scripts/ci-windows.ps1
          -Target "${{ matrix.target }}"
          -Triplet "${{ matrix.triplet }}"
          -VcArch "${{ matrix.vcarch }}"
          -VsComponent "${{ matrix.component }}"
          -Package
          -OutDir dist

      - name: Sign and notarize macOS CLI artifacts
        if: runner.os == 'macOS'
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          ZMANAGER_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in APPLE_DEVELOPER_ID_P12_BASE64 APPLE_DEVELOPER_ID_P12_PASSWORD \
            APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Configure the $secret_name repository Actions secret."
              exit 1
            fi
          done

          work="$RUNNER_TEMP/zmanager-cli-signing"
          keychain="$RUNNER_TEMP/zmanager-cli-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          certificate="$work/developer-id.p12"
          api_key="$work/AuthKey.p8"
          response_base="$work/notary-response-zm.json"
          response_full="$work/notary-response-zm-full.json"
          mkdir -p "$work/base" "$work/full" "$work/notary-zm" "$work/notary-zm-full"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -rf "$work"
          }
          trap cleanup EXIT

          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 -D > "$certificate"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$api_key"
          chmod 0600 "$certificate" "$api_key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk '/Developer ID Application/ { print $2 }')"
          if [[ -z "$identity" || "$(printf '%s\n' "$identity" | wc -l | tr -d ' ')" != 1 ]]; then
            echo "::error::The P12 must contain exactly one valid Developer ID Application identity."
            exit 1
          fi

          target="$ZMANAGER_TARGET"
          base_archive="dist/zm-$target.tar.gz"
          full_archive="dist/zm-full-$target.tar.gz"
          tar -xzf "$base_archive" -C "$work/base"
          tar -xzf "$full_archive" -C "$work/full"
          codesign --force --options runtime --timestamp --identifier org.tzap-org.zmanager-cli \
            --sign "$identity" "$work/base/zm"
          codesign --force --options runtime --timestamp --identifier org.tzap-org.zmanager-cli.full \
            --sign "$identity" "$work/full/zm-full"
          codesign --verify --strict --verbose=2 "$work/base/zm"
          codesign --verify --strict --verbose=2 "$work/full/zm-full"
          cp "$work/base/zm" "$work/notary-zm/zm"
          cp "$work/full/zm-full" "$work/notary-zm-full/zm-full"

          base_notary_zip="$work/zm-notary.zip"
          full_notary_zip="$work/zm-full-notary.zip"
          ditto -c -k --keepParent "$work/notary-zm" "$base_notary_zip"
          ditto -c -k --keepParent "$work/notary-zm-full" "$full_notary_zip"
          xcrun notarytool submit "$base_notary_zip" --key "$api_key" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --output-format json > "$response_base"
          base_submission_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["id"])' "$response_base")"
          if [[ -z "$base_submission_id" ]]; then
            echo "::error::Apple did not return a notarization submission ID for zm."
            exit 1
          fi
          echo "Apple notarization submission for zm: $base_submission_id"
          xcrun notarytool submit "$full_notary_zip" --key "$api_key" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --output-format json > "$response_full"
          full_submission_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["id"])' "$response_full")"
          if [[ -z "$full_submission_id" ]]; then
            echo "::error::Apple did not return a notarization submission ID for zm-full."
            exit 1
          fi
          echo "Apple notarization submission for zm-full: $full_submission_id"

          tar -czf "$base_archive" -C "$work/base" zm README.md LICENSE NOTICE THIRD_PARTY_NOTICES.md third-party-licenses completions man
          tar -czf "$full_archive" -C "$work/full" zm-full README.md LICENSE NOTICE THIRD_PARTY_NOTICES.md third-party-licenses completions man
          shasum -a 256 "$base_archive" > "$base_archive.sha256"
          shasum -a 256 "$full_archive" > "$full_archive.sha256"

          tar -xOf "$base_archive" zm > "$work/verify-zm"
          tar -xOf "$full_archive" zm-full > "$work/verify-zm-full"
          codesign --verify --strict "$work/verify-zm"
          codesign --verify --strict "$work/verify-zm-full"

          base_cdhash="$(codesign -dv --verbose=4 "$work/verify-zm" 2>&1 | awk -F= '/^CDHash=/ { print $2; exit }')"
          full_cdhash="$(codesign -dv --verbose=4 "$work/verify-zm-full" 2>&1 | awk -F= '/^CDHash=/ { print $2; exit }')"
          if [[ -z "$base_cdhash" || -z "$full_cdhash" ]]; then
            echo "::error::Could not record the signed CLI code directory hashes."
            exit 1
          fi
          python3 - "$target" "$base_submission_id" "$full_submission_id" "$base_cdhash" "$full_cdhash" > "dist/notarization-$target.json" <<'PY'
          import json
          import sys

          target, base_submission_id, full_submission_id, base_cdhash, full_cdhash = sys.argv[1:]
          print(json.dumps({
              "target": target,
              "submissions": [
                  {
                      "submission_id": base_submission_id,
                      "archive": f"zm-{target}.tar.gz",
                      "binary": "zm",
                      "cdhash": base_cdhash,
                  },
                  {
                      "submission_id": full_submission_id,
                      "archive": f"zm-full-{target}.tar.gz",
                      "binary": "zm-full",
                      "cdhash": full_cdhash,
                  },
              ],
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v6
        if: runner.os == 'macOS'
        with:
          name: notarization-${{ matrix.target }}
          path: dist/notarization-${{ matrix.target }}.json
          retention-days: 90
          if-no-files-found: error

      - name: Set pinned OpenSSL for test commands
        if: runner.os != 'Windows'
        run: |
          openssl_dir="$PWD/target/zmanager-openssl/3.5.9-rsa-pss-r1/${{ matrix.target }}"
          test -f "$openssl_dir/THIRD-PARTY-NOTICES.txt"
          printf '%s\n' "OPENSSL_DIR=$openssl_dir" OPENSSL_STATIC=1 OPENSSL_NO_VENDOR=1 >> "$GITHUB_ENV"

      - name: Test installed offline package (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo test --locked --release --target "${{ matrix.target }}" \
            -p zmanager-cli --no-default-features --test offline_tzap_cli --no-run
          sandbox-exec -p '(version 1)(allow default)(deny network*)' \
            python3 scripts/require-network-denial.py \
            python3 scripts/test-offline-package.py "dist/zm-${{ matrix.target }}.tar.gz" \
            --workflow cargo test --offline --locked --release --target "${{ matrix.target }}" \
            -p zmanager-cli --no-default-features --test offline_tzap_cli -- --nocapture

      - name: Test Unix installer and failed-update recovery
        if: runner.os != 'Windows'
        run: python3 scripts/test-unix-installer.py "dist/zm-${{ matrix.target }}.tar.gz"

      - name: Test installed offline package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/test-offline-package.py "dist/zm-${{ matrix.target }}.zip"

      - name: Test installed static package in clean Alpine (Linux)
        if: runner.os == 'Linux'
        run: >
          docker run --rm --network none
          -v "$PWD/dist:/packages:ro"
          -v "$PWD/scripts/test-offline-package.py:/test-offline-package.py:ro"
          python:3.13-alpine python /test-offline-package.py
          "/packages/zm-${{ matrix.target }}.tar.gz"

      - uses: actions/upload-artifact@v6
        with:
          name: zm-${{ matrix.target }}
          path: dist/zm*${{ matrix.target }}.*
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: zm-build-inputs-${{ matrix.target }}
          path: target/build-inputs-report.tsv
          if-no-files-found: error

  publish:
    name: Stage draft GitHub release
    if: github.event_name != 'workflow_dispatch' || !inputs.notarization_test
    runs-on: ubuntu-22.04
    needs: package

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Prepare checksums
        run: |
          cd release-artifacts
          sha256sum *.tar.gz *.zip *.deps.txt > SHA256SUMS

      - name: Prepare notarization manifest
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python3 - "$TAG_NAME" release-artifacts/notarization-submissions.json <<'PY'
          import glob
          import json
          import sys

          tag, output = sys.argv[1:]
          records = []
          for path in sorted(glob.glob("release-artifacts/notarization-*.json")):
              with open(path, encoding="utf-8") as file:
                  records.append(json.load(file))
          expected = {"aarch64-apple-darwin", "x86_64-apple-darwin"}
          expected_archives = {
              (target, f"zm-{target}.tar.gz") for target in expected
          } | {
              (target, f"zm-full-{target}.tar.gz") for target in expected
          }
          if {record["target"] for record in records} != expected or len(records) != len(expected):
              raise SystemExit(f"Expected per-architecture records for {sorted(expected)}")
          actual_submissions = {
              (record["target"], submission["archive"])
              for record in records
              for submission in record.get("submissions", [])
          }
          if actual_submissions != expected_archives or sum(len(record.get("submissions", [])) for record in records) != 4:
              raise SystemExit("Expected separate notarization submissions for zm and zm-full on both architectures")
          with open(output, "w", encoding="utf-8") as file:
              submissions = [
                  {"target": record["target"], **submission}
                  for record in records
                  for submission in record["submissions"]
              ]
              json.dump({"schema_version": 2, "tag": tag, "submissions": submissions}, file, indent=2)
              file.write("\n")
          PY

      - name: Prepare package metadata
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          scripts/generate-package-metadata.sh \
            "$TAG_NAME" \
            "https://github.com/tzap-org/zmanager/releases/download/$TAG_NAME" \
            release-artifacts/SHA256SUMS \
            release-artifacts/package-metadata
          tar -C release-artifacts/package-metadata -czf release-artifacts/package-metadata.tar.gz .
          (
            cd release-artifacts
            sha256sum package-metadata.tar.gz >> SHA256SUMS
          )

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
          CUSTOM_NOTES: ${{ github.event.inputs.notes }}
        run: |
          # Never remove or replace an existing release. The poller publishes
          # this draft only after Apple accepts all four submissions and Gatekeeper
          # accepts the downloaded binaries.
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::A release already exists for $TAG_NAME; refusing to overwrite it."
            exit 1
          fi
          if [ -n "$CUSTOM_NOTES" ]; then
            NOTES_ARGS=(--notes "$CUSTOM_NOTES")
          elif [ -f "docs/release-notes/${TAG_NAME#v}.md" ]; then
            NOTES_ARGS=(--notes-file "docs/release-notes/${TAG_NAME#v}.md")
          else
            NOTES_ARGS=(--generate-notes)
          fi
          gh release create "$TAG_NAME" \
            release-artifacts/*.tar.gz \
            release-artifacts/*.zip \
            release-artifacts/*.deps.txt \
            release-artifacts/SHA256SUMS \
            release-artifacts/notarization-submissions.json \
            --verify-tag \
            --draft \
            --title "$TAG_NAME" \
            "${NOTES_ARGS[@]}"
