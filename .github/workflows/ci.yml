name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      ZMANAGER_TEST_SKIP_REPORT: ${{ github.workspace }}/target/optional-test-skips.jsonl
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
          - name: macOS Intel
            os: macos-15-intel
          - name: Linux x86_64
            os: ubuntu-22.04
          - name: Linux ARM64
            os: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v6

      - name: Initialize optional test reporting
        shell: bash
        run: |
          mkdir -p "$(dirname "$ZMANAGER_TEST_SKIP_REPORT")"
          : > "$ZMANAGER_TEST_SKIP_REPORT"

      - name: Install Bash on macOS
        if: runner.os == 'macOS'
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix)/bin/bash" --version | head -n 1

      - name: Clone tzap
        run: git clone https://github.com/tzap-org/tzap.git ../tzap

      - name: Clone localsend-rs
        run: |
          LOCALSEND_REV=$(cat localsend-rs-rev.txt 2>/dev/null || echo "main")
          git clone https://github.com/frankmanzhu/localsend-rs.git ../localsend-rs
          git -C ../localsend-rs checkout "$LOCALSEND_REV" || git -C ../localsend-rs checkout main

      - name: Clone forensic-vfs-engine
        run: |
          FVE_REV=$(cat forensic-vfs-engine-rev.txt 2>/dev/null || echo "main")
          git clone https://github.com/frankmanzhu/forensic-vfs-engine.git ../forensic-vfs-engine
          git -C ../forensic-vfs-engine checkout "$FVE_REV" || git -C ../forensic-vfs-engine checkout main

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        # lzop, lrzip, lha, and ncompress (uncompress) create the optional
        # compatibility fixtures in the CLI compat tests; they are test
        # oracles only — the shipped binaries decode lzop/compress streams
        # natively and reject lrzip with an explicit unsupported error.
        run: brew install cmake libb2 lz4 xz zstd lzop lrzip ncompress lhasa sevenzip gcab dpkg cdrtools

      - name: Force Clang on macOS
        if: runner.os == 'macOS'
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            brotli \
            bzip2 \
            cmake \
            dbus-x11 \
            gcab \
            genisoimage \
            gnome-keyring \
            gzip \
            libacl1-dev \
            libarchive-tools \
            libbz2-dev \
            liblz4-dev \
            liblzma-dev \
            libssl-dev \
            libxml2-dev \
            libzstd-dev \
            dpkg-dev \
            lrzip \
            lz4 \
            lzip \
            lzop \
            ncompress \
            python3 \
            rpm \
            unzip \
            xdotool \
            xvfb \
            xz-utils \
            zlib1g-dev \
            zip \
            zstd
          sudo apt-get install -y 7zip || sudo apt-get install -y p7zip-full
          sudo apt-get install -y lha || sudo apt-get install -y lhasa || true

      - name: Start D-Bus and GNOME Keyring
        if: runner.os == 'Linux'
        run: |
          # A filesystem Unix socket remains accessible inside the offline
          # network namespace; an abstract Unix socket would be isolated too.
          bus_directory=$(mktemp -d)
          mapfile -t bus < <(dbus-daemon --session --fork --address="unix:path=$bus_directory/bus" --print-address=1 --print-pid=1)
          export DBUS_SESSION_BUS_ADDRESS=${bus[0]}
          export DBUS_SESSION_BUS_PID=${bus[1]}
          eval "$(printf '\n' | gnome-keyring-daemon --unlock 2>/dev/null || true)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_PID=$DBUS_SESSION_BUS_PID" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Format
        run: cargo fmt --check

      - name: Verify reduced artifact profiles
        run: bash scripts/verify-artifact-profiles.sh

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        shell: bash
        run: |
          set +e
          set -o pipefail
          cargo test --workspace 2>&1 | tee cargo-test.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            {
              echo "### cargo test failed"
              echo
              echo '```text'
              tail -n 80 cargo-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            message="$(tail -n 40 cargo-test.log)"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=cargo test failed::$message"
            exit "$status"
          fi

      - name: External fixture compatibility
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          command -v unzip
          command -v 7zz || command -v 7z
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            command -v bsdtar
          else
            command -v tar
          fi
          cargo test -p zmanager-cli --test external_fixture_cli -- --nocapture

      - name: Test isolated offline profiles and release CLI
        run: |
          cargo test --locked -p zmanager-core --no-default-features
          cargo test --locked -p zmanager-ffi --no-default-features
          cargo test --locked --release -p zmanager-cli --no-default-features

      - name: Test offline release with network denied (macOS)
        if: runner.os == 'macOS'
        run: >
          sandbox-exec -p '(version 1)(allow default)(deny network*)'
          python3 scripts/require-network-denial.py
          cargo test --offline --locked --release -p zmanager-cli --no-default-features

      - name: Test offline release with network denied (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo --preserve-env=HOME,PATH,RUSTUP_HOME,CARGO_HOME,DBUS_SESSION_BUS_ADDRESS,LANG,LC_ALL,ZMANAGER_TEST_SKIP_REPORT
          unshare --net --setuid "$(id -u)" --setgid "$(id -g)" --
          python3 scripts/require-network-denial.py
          cargo test --offline --locked --release -p zmanager-cli --no-default-features

      - name: Sudo password authentication (${{ matrix.name }})
        shell: bash
        timeout-minutes: 5
        run: |
          python3 scripts/ci-unix-elevation.py target/release/zm

      - name: Disk-full and killed-writer recovery
        run: python3 scripts/test-write-failures.py target/release/zm

      - name: Native Secret Service cancellation and unlock recovery
        if: runner.os == 'Linux'
        env:
          ZMANAGER_TEST_CATALOG_DISK_FULL: "1"
        run: python3 scripts/test-linux-secret-store.py target/release/zm

      - name: Report skipped optional checks
        if: always()
        run: python3 scripts/report-test-skips.py "$ZMANAGER_TEST_SKIP_REPORT"

      - name: Upload skipped check inventory
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-skips-${{ matrix.os }}
          path: ${{ env.ZMANAGER_TEST_SKIP_REPORT }}

  uniffi-bindings-check:
    name: UniFFI bindings are up to date
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Clone tzap
        run: git clone https://github.com/tzap-org/tzap.git ../tzap

      - name: Clone localsend-rs
        run: |
          LOCALSEND_REV=$(cat localsend-rs-rev.txt 2>/dev/null || echo "main")
          git clone https://github.com/frankmanzhu/localsend-rs.git ../localsend-rs
          git -C ../localsend-rs checkout "$LOCALSEND_REV" || git -C ../localsend-rs checkout main

      - name: Clone forensic-vfs-engine
        run: |
          FVE_REV=$(cat forensic-vfs-engine-rev.txt 2>/dev/null || echo "main")
          git clone https://github.com/frankmanzhu/forensic-vfs-engine.git ../forensic-vfs-engine
          git -C ../forensic-vfs-engine checkout "$FVE_REV" || git -C ../forensic-vfs-engine checkout main

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libacl1-dev \
            libbz2-dev \
            liblz4-dev \
            liblzma-dev \
            libssl-dev \
            libxml2-dev \
            libzstd-dev \
            zlib1g-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Regenerate bindings into a scratch directory
        run: |
          REGEN_KOTLIN_DIR="$RUNNER_TEMP/uniffi-check/kotlin" \
          REGEN_SWIFT_DIR="$RUNNER_TEMP/uniffi-check/swift" \
            bash scripts/generate-uniffi-bindings.sh

      - name: Verify checked-in bindings match the current UDL
        run: |
          status=0
          diff -rq crates/zmanager-ffi/bindings/swift "$RUNNER_TEMP/uniffi-check/swift" || status=1
          diff -rq crates/zmanager-ffi/bindings/kotlin "$RUNNER_TEMP/uniffi-check/kotlin" || status=1
          if [ "$status" -ne 0 ]; then
            echo "::error::Checked-in UniFFI bindings (crates/zmanager-ffi/bindings) do not match what the current UDL/FFI source generates. Run the 'Regenerate UniFFI bindings' workflow (workflow_dispatch) and merge the result before this branch can land."
            exit 1
          fi

  archive-architecture:
    name: Archive architecture guard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      # The guard checks that products consume archives through the engine
      # seam rather than reaching into backend implementations. zmanager-desktop
      # is one of those products, so it has to be present or those checks scan
      # nothing; the script reports any root it could not scan.
      - name: Clone zmanager-desktop
        run: git clone --depth 1 https://github.com/tzap-org/zmanager-desktop.git ../zmanager-desktop

      - name: Check archive architecture
        run: bash scripts/check-archive-architecture.sh

  windows-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      ZMANAGER_TEST_SKIP_REPORT: ${{ github.workspace }}/target/optional-test-skips.jsonl
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 MSVC
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            triplet: x64-windows-static
            vcarch: x64
            component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          - name: Windows ARM64 MSVC
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            triplet: arm64-windows-static
            vcarch: arm64
            component: Microsoft.VisualStudio.Component.VC.Tools.ARM64

    steps:
      - uses: actions/checkout@v6

      - name: Initialize optional test reporting
        shell: bash
        run: |
          mkdir -p "$(dirname "$ZMANAGER_TEST_SKIP_REPORT")"
          : > "$ZMANAGER_TEST_SKIP_REPORT"

      - name: Clone tzap
        shell: bash
        run: git clone https://github.com/tzap-org/tzap.git ../tzap

      - name: Clone localsend-rs
        shell: bash
        run: |
          LOCALSEND_REV=$(cat localsend-rs-rev.txt 2>/dev/null || echo "main")
          git clone https://github.com/frankmanzhu/localsend-rs.git ../localsend-rs
          git -C ../localsend-rs checkout "$LOCALSEND_REV" || git -C ../localsend-rs checkout main

      - name: Clone forensic-vfs-engine
        shell: bash
        run: |
          FVE_REV=$(cat forensic-vfs-engine-rev.txt 2>/dev/null || echo "main")
          git clone https://github.com/frankmanzhu/forensic-vfs-engine.git ../forensic-vfs-engine
          git -C ../forensic-vfs-engine checkout "$FVE_REV" || git -C ../forensic-vfs-engine checkout main

      - name: Test
        shell: pwsh
        run: >
          powershell -ExecutionPolicy Bypass -File scripts/ci-windows.ps1
          -Target "${{ matrix.target }}"
          -Triplet "${{ matrix.triplet }}"
          -VcArch "${{ matrix.vcarch }}"
          -VsComponent "${{ matrix.component }}"

      - name: Killed-writer recovery
        shell: pwsh
        run: python scripts/test-write-failures.py "target/${{ matrix.target }}/release/zm.exe" --interrupt-only

      - name: Report skipped optional checks
        if: always()
        shell: pwsh
        run: python scripts/report-test-skips.py "$env:ZMANAGER_TEST_SKIP_REPORT"

      - name: Upload skipped check inventory
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-skips-${{ matrix.target }}
          path: ${{ env.ZMANAGER_TEST_SKIP_REPORT }}
