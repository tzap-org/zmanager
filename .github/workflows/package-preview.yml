name: Package Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package-preview.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "packaging/**"
      - "scripts/**"

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: "11.0"

concurrency:
  group: package-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            triplet: x64-windows-static
            vcarch: x64
            component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            triplet: arm64-windows-static
            vcarch: arm64
            component: Microsoft.VisualStudio.Component.VC.Tools.ARM64

    steps:
      - uses: actions/checkout@v6

      - name: Clone tzap
        shell: bash
        run: git clone https://github.com/tzap-org/tzap.git ../tzap

      - name: Clone localsend-rs
        shell: bash
        run: |
          LOCALSEND_REV=$(cat localsend-rs-rev.txt 2>/dev/null || echo "main")
          git clone https://github.com/frankmanzhu/localsend-rs.git ../localsend-rs
          git -C ../localsend-rs checkout "$LOCALSEND_REV" || git -C ../localsend-rs checkout main

      - name: Clone forensic-vfs-engine
        shell: bash
        run: |
          FVE_REV=$(cat forensic-vfs-engine-rev.txt 2>/dev/null || echo "main")
          git clone https://github.com/frankmanzhu/forensic-vfs-engine.git ../forensic-vfs-engine
          git -C ../forensic-vfs-engine checkout "$FVE_REV" || git -C ../forensic-vfs-engine checkout main

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake libb2 lz4 xz zstd

      - name: Force Clang on macOS
        if: runner.os == 'macOS'
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: ${{ runner.os == 'Linux' && !contains(matrix.target, 'unknown-linux-musl') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            cmake \
            file \
            musl-tools \
            xz-utils \
            python3 \
            build-essential
          sudo scripts/install-zig-linux.sh /opt/zig
          echo /opt/zig >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        if: ${{ !contains(matrix.target, 'unknown-linux-musl') }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - uses: actions/setup-python@v6
        if: runner.os == 'Windows'
        with:
          python-version: "3.x"

      - name: Package Unix
        if: ${{ runner.os != 'Windows' && !contains(matrix.target, 'unknown-linux-musl') }}
        run: scripts/package-release.sh "${{ matrix.target }}" dist

      - name: Package Linux musl in Alpine
        if: contains(matrix.target, 'unknown-linux-musl')
        run: scripts/package-release-alpine.sh "${{ matrix.target }}" dist

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          powershell -ExecutionPolicy Bypass -File scripts/ci-windows.ps1
          -Target "${{ matrix.target }}"
          -Triplet "${{ matrix.triplet }}"
          -VcArch "${{ matrix.vcarch }}"
          -VsComponent "${{ matrix.component }}"
          -Package
          -OutDir dist

      - name: Summarize preview artifacts
        shell: bash
        run: |
          {
            echo "### Package preview"
            echo
            echo "Download this run's artifacts from the GitHub Actions run page."
            echo "Linux tarballs are static single-binary artifacts."
            echo
            echo '```text'
            ls -1 dist
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test installed offline package (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo test --locked --release --target "${{ matrix.target }}" \
            -p zmanager-cli --no-default-features --test offline_tzap_cli --no-run
          sandbox-exec -p '(version 1)(allow default)(deny network*)' \
            python3 scripts/require-network-denial.py \
            python3 scripts/test-offline-package.py "dist/zm-${{ matrix.target }}.tar.gz" \
            --workflow cargo test --offline --locked --release --target "${{ matrix.target }}" \
            -p zmanager-cli --no-default-features --test offline_tzap_cli -- --nocapture

      - name: Test Unix installer and failed-update recovery
        if: runner.os != 'Windows'
        run: python3 scripts/test-unix-installer.py "dist/zm-${{ matrix.target }}.tar.gz"

      - name: Test installed offline package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/test-offline-package.py "dist/zm-${{ matrix.target }}.zip"

      - name: Test installed static package in clean Alpine (Linux)
        if: runner.os == 'Linux'
        run: >
          docker run --rm --network none
          -v "$PWD/dist:/packages:ro"
          -v "$PWD/scripts/test-offline-package.py:/test-offline-package.py:ro"
          python:3.13-alpine python /test-offline-package.py
          "/packages/zm-${{ matrix.target }}.tar.gz"

      - uses: actions/upload-artifact@v6
        with:
          name: zm-preview-${{ matrix.target }}-offline
          path: dist/zm-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v6
        with:
          name: zm-preview-${{ matrix.target }}-full
          path: dist/zm-full-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 14
