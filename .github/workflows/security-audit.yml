name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Check newly published advisories even when dependencies have not changed.
    - cron: "23 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: RustSec (${{ matrix.lockfile }})
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lockfile: [Cargo.lock, fuzz/Cargo.lock]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-audit
        run: cargo +stable install cargo-audit --locked --version 0.22.2

      # Audit registry dependencies in both committed ZManager lockfiles.
      - name: Check vulnerabilities, unsound crates, and yanked dependencies
        run: cargo +stable audit --deny unsound --deny yanked --file "${{ matrix.lockfile }}"

      - name: Check out TZAP development source
        if: matrix.lockfile == 'Cargo.lock'
        uses: actions/checkout@v6
        with:
          repository: tzap-org/tzap
          ref: main
          path: _sibling/tzap

      - name: Audit TZAP development lockfile
        if: matrix.lockfile == 'Cargo.lock'
        run: cargo +stable audit --deny unsound --deny yanked --file _sibling/tzap/Cargo.lock
