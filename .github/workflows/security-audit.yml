name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Check newly published advisories even when dependencies have not changed.
    - cron: "23 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: RustSec (${{ matrix.lockfile }})
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lockfile: [Cargo.lock, fuzz/Cargo.lock]
    steps:
      - uses: actions/checkout@v6

      # Development and security CI consume the sibling checkout so fixes can
      # be audited before a crates.io release. Release workflows deliberately
      # remove this Cargo config patch and use the published TZAP version.
      - name: Clone tzap
        run: git clone https://github.com/tzap-org/tzap.git ../tzap

      - name: Clone localsend-rs
        run: |
          LOCALSEND_REV=$(cat localsend-rs-rev.txt 2>/dev/null || echo "main")
          git clone https://github.com/frankmanzhu/localsend-rs.git ../localsend-rs
          git -C ../localsend-rs checkout "$LOCALSEND_REV" || git -C ../localsend-rs checkout main

      - name: Clone forensic-vfs-engine
        run: |
          FVE_REV=$(cat forensic-vfs-engine-rev.txt 2>/dev/null || echo "main")
          git clone https://github.com/frankmanzhu/forensic-vfs-engine.git ../forensic-vfs-engine
          git -C ../forensic-vfs-engine checkout "$FVE_REV" || git -C ../forensic-vfs-engine checkout main

      - name: Checkout pinned dependency forks
        run: bash scripts/checkout-forensic-forks.sh

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-audit
        run: cargo +stable install cargo-audit --locked --version 0.22.2

      - name: Resolve sibling Tzap dependency
        run: |
          if [[ "${{ matrix.lockfile }}" == "Cargo.lock" ]]; then
            cargo update --package tzap-core
            cargo update --package crypto-bigint
          else
            cargo update --manifest-path fuzz/Cargo.toml --package tzap-core
            cargo update --manifest-path fuzz/Cargo.toml --package crypto-bigint
          fi

      # The per-job lockfile now reflects the sibling Tzap checkout, matching
      # local development. Release builds continue to use published crates.
      - name: Check vulnerabilities and yanked dependencies
        run: cargo audit --deny yanked --file "${{ matrix.lockfile }}"
