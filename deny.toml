# cargo-deny policy for the zmanager workspace.
#
# The workspace itself is Apache-2.0; this policy enforces that every
# dependency carries a permissive license we can rely on. cargo-deny v2
# defaults to DENYING every license that is not explicitly listed below,
# so a new dependency with an unknown or copyleft license fails CI until
# someone reviews it and either adds it here (with intent) or replaces the
# dependency.
#
# Run locally:  cargo deny check licenses
# CI:           .github/workflows/license-audit.yml

[licenses]
allow = [
    # The two licenses we standardize on.
    "MIT",
    "Apache-2.0",
    # Apache-2.0 with the LLVM boilerplate exception (LLVM/rust-lang style).
    "Apache-2.0 WITH LLVM-exception",
    # Other OSI/FSF permissive licenses found in the current tree.
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "0BSD",
    "Zlib",
    "BSL-1.0",
    # Public-domain dedications (ppmd-rust: CC0-1.0 OR MIT-0).
    "CC0-1.0",
    "MIT-0",
    # Unicode License v3 (ICU4X family: icu_*, zerovec, yoke, ...).
    "Unicode-3.0",
    # CDLA-Permissive-2.0 is used by webpki-root-certs, pulled by the
    # pinned LocalSend dependency through reqwest/rustls. It is a permissive
    # certificate-data license and is reviewed as part of LocalSend's TLS
    # dependency chain.
    "CDLA-Permissive-2.0",
    # bzip2's classic BSD-style license (libbz2-rs-sys).
    "bzip2-1.0.6",
    # MPL-2.0 is the one weak copyleft in the tree: the uniffi binding
    # generator (zmanager-ffi only). MPL-2.0 is file-level copyleft; we use
    # uniffi unmodified as a static dependency, which is the standard, widely
    # deployed commercial usage (Firefox, Mozilla VPN). Reviewed 2026-08-12;
    # every crate is documented in THIRD_PARTY_NOTICES.md. Kept as a global
    # allow with justification instead of per-crate exceptions because the
    # uniffi family (10 crates) is tracked as a unit.
    "MPL-2.0",
]

# The vendored UnRAR code inside zmanager-unrar carries the UnRAR freeware
# license (detected from vendor/unrar/license.txt; the Cargo.toml has no
# license field). It permits unarchiving use but not re-creating RAR
# compression; documented in THIRD_PARTY_NOTICES.md. Scoped to this crate
# only, so no other crate can slip in under this license.
exceptions = [
    { allow = ["UnRAR"], crate = "zmanager-unrar" },
]

# Workspace crates are our own code.
[licenses.private]
ignore = true

[bans]
# Freeze the duplicate set. Anything NOT listed below fails CI, so a routine
# bump cannot quietly add a third version line. Entries are the audit trail:
# each one is a duplicate we have decided we cannot remove today, and why.
multiple-versions = "deny"
skip = [
    # RustCrypto 0.10 -> 0.11 migration boundary. Pinned by ed25519-dalek (digest 0.10)
    # and the SecurityRonin forensic family; not resolvable until dalek moves.
    { crate = "aead@0.5.2" },
    { crate = "aes-gcm@0.10.3" },
    { crate = "aes@0.8.4" },
    { crate = "block-buffer@0.10.4" },
    { crate = "block-padding@0.3.3" },
    { crate = "cbc@0.1.2" },
    { crate = "chacha20@0.9.1" },
    { crate = "chacha20poly1305@0.10.1" },
    { crate = "cipher@0.4.4" },
    { crate = "const-oid@0.9.6" },
    { crate = "constant_time_eq@0.3.1" },
    { crate = "cpufeatures@0.2.17" },
    { crate = "crypto-common@0.1.7" },
    { crate = "ctr@0.9.2" },
    { crate = "digest@0.10.7" },
    { crate = "getrandom@0.2.17" },
    { crate = "getrandom@0.3.4" },
    { crate = "ghash@0.5.1" },
    { crate = "hkdf@0.12.4" },
    { crate = "hmac@0.12.1" },
    { crate = "inout@0.1.4" },
    { crate = "pbkdf2@0.12.2" },
    { crate = "poly1305@0.8.0" },
    { crate = "polyval@0.6.2" },
    { crate = "r-efi@5.3.0" },
    { crate = "rand_core@0.6.4" },
    { crate = "rand_core@0.9.5" },
    { crate = "sha1@0.10.7" },
    { crate = "sha2@0.10.9" },
    { crate = "universal-hash@0.5.1" },

    # SecurityRonin forensic family disagreeing with itself; upstream issue filed
    # against the family rather than bumped per-crate here.
    { crate = "ruzstd@0.7.3" },
    { crate = "safe-read@0.1.0" },
    { crate = "twox-hash@1.6.3" },
    { crate = "zip-forensic-core@0.1.0" },

    # Codec lines held by separate subtrees (zmanager backends / forensic engine / dpp).
    { crate = "bzip2@0.5.2" },
    { crate = "lz4_flex@0.11.6" },
    { crate = "lz4_flex@0.12.2" },
    { crate = "lzma-rust2@0.16.5" },
    { crate = "quick-xml@0.37.5" },
    { crate = "zip@2.4.2" },

    # Build-time only (proc-macro) or platform crates not built on our targets.
    # The `mtree` crate previously anchored bitflags 1.x and smallvec 0.6 here;
    # replacing it with the in-tree reader collapsed both.
    { crate = "core-foundation@0.9.4" },
    { crate = "fs-err@2.11.0" },
    { crate = "io-lifetimes@2.0.4" },
    { crate = "syn@2.0.119" },
    { crate = "windows-sys@0.52.0" },
    { crate = "windows-sys@0.59.0" },
    { crate = "windows-sys@0.60.2" },
    { crate = "windows-targets@0.52.6" },
    { crate = "windows_aarch64_gnullvm@0.52.6" },
    { crate = "windows_aarch64_msvc@0.52.6" },
    { crate = "windows_i686_gnu@0.52.6" },
    { crate = "windows_i686_gnullvm@0.52.6" },
    { crate = "windows_i686_msvc@0.52.6" },
    { crate = "windows_x86_64_gnu@0.52.6" },
    { crate = "windows_x86_64_gnullvm@0.52.6" },
    { crate = "windows_x86_64_msvc@0.52.6" },
    { crate = "winnow@0.7.15" },

]
