# Fetch git dependencies (dpp fork, tzap, forensic-vfs-engine) with the git CLI
# instead of libgit2. GitHub Actions' macos-15-intel runners fail libgit2's TLS
# handshake to github.com ("untrusted connection error; class=Ssl(16)") while
# the git CLI's system-cert path succeeds; this is also cargo's own suggested
# remedy in that error message.
[net]
git-fetch-with-cli = true

# Development default: build tzap-core from the ../tzap sibling checkout
# instead of the published crate, so in-progress tzap fixes are picked up
# before they're released. The committed Cargo.lock tracks the published crate;
# CI, package preview, offline audits, and release builds remove this section
# before running locked builds.
[patch.crates-io]
tzap-core = { path = "../tzap/crates/tzap-core" }
