# Fetch git dependencies (dpp fork, tzap, forensic-vfs-engine) with the git CLI
# instead of libgit2. GitHub Actions' macos-15-intel runners fail libgit2's TLS
# handshake to github.com ("untrusted connection error; class=Ssl(16)") while
# the git CLI's system-cert path succeeds; this is also cargo's own suggested
# remedy in that error message.
[net]
git-fetch-with-cli = true

# Development default: build the complete TZAP crate family from the ../tzap
# sibling checkout. This keeps local development and CI snapshots on the same
# prerelease source. Release builds remove these patches and use stable crates.
[patch.crates-io]
tzap-core = { path = "../tzap/crates/tzap-core" }
tzap-plugin-keywrap = { path = "../tzap/crates/tzap-plugin-keywrap" }
tzap-plugin-signing = { path = "../tzap/crates/tzap-plugin-signing" }
