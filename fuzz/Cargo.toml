[package]
name = "zmanager-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tzap-core = "0.2.4"
zip = "8.6.0"
zmanager-core = { path = "../crates/zmanager-core" }

[[bin]]
name = "path_normalization"
path = "fuzz_targets/path_normalization.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zip_metadata"
path = "fuzz_targets/zip_metadata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tzap_footer_inspect"
path = "fuzz_targets/tzap_footer_inspect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pattern_matching"
path = "fuzz_targets/pattern_matching.rs"
test = false
doc = false
bench = false
