[package]
name = "zmanager-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tzap-core = "0.2.4"
zip = "9.0.5"
zmanager-core = { path = "../crates/zmanager-core" }

# Cargo does not inherit patches across workspace roots. Keep these aligned
# with the main workspace until fixed forensic releases are available.
[patch.crates-io]
aff4 = { path = "../../aff4/core" }
btrfs-core = { path = "../../btrfs-core/core" }
dar-core = { path = "../../dar-core/core" }
zfs-forensic-core = { path = "../../zfs-forensic-core/core" }
zip-forensic-core = { path = "../../zip-forensic-core/core" }

[[bin]]
name = "path_normalization"
path = "fuzz_targets/path_normalization.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zip_metadata"
path = "fuzz_targets/zip_metadata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tzap_footer_inspect"
path = "fuzz_targets/tzap_footer_inspect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pattern_matching"
path = "fuzz_targets/pattern_matching.rs"
test = false
doc = false
bench = false
